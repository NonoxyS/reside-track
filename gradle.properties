# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G -XX:+UseParallelGC
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Gradle
org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configureondemand=true
# Configuration cache отключён: корневой changeGitHooksDir выполняет exec на этапе
# конфигурации и несовместим с ним. Включить после очистки скрипта.
# org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Keystore
DEBUG_KEY_ALIAS=androiddebugkey
DEBUG_STORE_PASSWORD=android

# Moko
moko.resources.disableStaticFrameworkWarning=true
